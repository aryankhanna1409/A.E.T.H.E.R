[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "AETHER: Adaptive Engine for Thought, Heuristics, Evolution & Reasoning. A fully local, neuro-symbolic personal assistant."
authors = [{ name = "Aryan" }]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "llama-cpp-python>=0.3",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "ddgs>=9.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
documents = ["pypdf>=4.0", "python-docx>=1.1"]
computer = ["pywinauto>=0.6.8; sys_platform == 'win32'", "mss>=9.0", "rapidocr-onnxruntime>=1.3", "numpy>=1.26"]
voice = ["faster-whisper>=1.0", "piper-tts>=1.2", "openwakeword>=0.6", "sounddevice>=0.4", "numpy>=1.26"]
transformers = ["transformers>=4.44", "torch>=2.3", "accelerate>=0.33"]
dev = ["pytest>=8"]
all = ["aether[embeddings,documents,computer,voice,dev]"]

[project.scripts]
aether = "aether.interface.cli:main"
aether-server = "aether.interface.server:main"
aether-voice = "aether.speech.voice_loop:main"
aether-eval = "aether.evals.scenarios:main"

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.setuptools.package-data]
aether = ["interface/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
