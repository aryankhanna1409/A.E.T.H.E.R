[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "30.0.0"
description = "AETHER: Adaptive Engine for Thought, Heuristics, Evolution & Reasoning. A fully local, neuro-symbolic personal assistant."
authors = [{ name = "Aryan" }]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "ddgs>=9.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
documents = ["pypdf>=4.0", "python-docx>=1.1"]
computer = ["pywinauto>=0.6.8; sys_platform == 'win32'", "mss>=9.0", "rapidocr-onnxruntime>=1.3", "numpy>=1.26", "psutil>=5.9"]
tray = ["pystray>=0.19", "pillow>=10", "pynput>=1.7", "psutil>=5.9"]
voice = ["faster-whisper>=1.0", "kokoro-onnx>=0.4", "piper-tts>=1.2", "openwakeword>=0.6", "sounddevice>=0.4", "numpy>=1.26"]
transformers = ["transformers>=4.44", "torch>=2.3", "accelerate>=0.33"]
dev = ["pytest>=8"]
# The model runner. On Windows, scripts\setup_windows.ps1 installs a prebuilt (CUDA or CPU) wheel so no compiler is
# needed; it is kept out of "all" so a missing wheel can never block the other packages. Elsewhere: pip install -e ".[llm]"
llm = ["llama-cpp-python>=0.3"]
all = ["aether[embeddings,documents,computer,voice,tray,dev]"]

[project.scripts]
aether = "aether.interface.cli:main"
aether-server = "aether.interface.server:main"
aether-voice = "aether.speech.voice_loop:main"
aether-tray = "aether.interface.tray:main"
aether-nova = "aether.interface.nova:main"
aether-eval = "aether.evals.scenarios:main"
aether-bench-symbolic = "aether.evals.symbolic:main"

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.setuptools.package-data]
aether = ["interface/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
