# Copy to aether.toml (next to where you run AETHER) or to %LOCALAPPDATA%\AETHER\aether.toml
user_name = "Aryan"
persona = "aether"               # aether (understated chief of staff) | neutral
address_as = ""                  # e.g. "sir" if you like being called that
max_plan_steps = 8

[llm]
backend = "llama_cpp"            # in-process llama.cpp; no Ollama, no server, no API
# Tuned for HP Victus 15: RTX 3050 Laptop (4 GB), Ryzen 5 5600H, 16 GB RAM.
model_path = "C:/AETHER/models/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf"
context_tokens = 6144
gpu_layers = 20                  # 7B on 4 GB VRAM: 18-22 fits; run scripts/tune_gpu.py to pick
threads = 6                      # the 5600H's 6 physical cores
batch_size = 256
flash_attn = true
draft_lookup_tokens = 0          # speculative decoding by prompt lookup; try 10 after `scripts\bench.py --compare-draft`
# Faster brain that fits entirely in 4 GB VRAM: about 3x quicker replies, a bit less careful on long reasoning.
# Works with the pinned llama-cpp-python 0.3.4. (Qwen3-class 4B models need a newer llama.cpp than that wheel,
# so they're not the default until an official CUDA wheel for Windows ships.)
#   model_path = "C:/AETHER/models/qwen2.5-3b-instruct-q4_k_m.gguf"
#   gpu_layers = -1
#   context_tokens = 8192
# Fast talker (Mark XXIX): a 1.5B fully on the GPU answers spoken small talk in a fraction of a second, the 7B keeps
# the hard work. Download with scripts\get_model.py fast, then lower gpu_layers above to ~14 so both fit:
# fast_model_path = "C:/AETHER/models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
temperature = 0.6
max_reply_tokens = 1024

[embeddings]
backend = "sentence_transformers"  # or "lexical" for BM25 only (no embedding model)
model = "BAAI/bge-small-en-v1.5"   # downloaded once into the Hugging Face cache, offline after
device = "cpu"                     # keep on CPU: the 4 GB of VRAM is reserved for the LLM

[memory]
rag_min_score = 0.25
rag_top_k = 6
hybrid_alpha = 0.6
reranker_model = ""              # "BAAI/bge-reranker-base" for better document answers (CPU, ~1 GB RAM)
watch_interval_s = 300           # re-index your folders every 5 minutes (0 = off)

[context]
topic_switch_threshold = 0.12

[security]
# AETHER starts read-only inside these folders. Add write roots deliberately.
allowed_read_roots = ["C:/Users/Aryan/Documents/AETHER", "C:/Users/Aryan/Documents/Research"]
allowed_write_roots = ["C:/Users/Aryan/Documents/AETHER/output"]
auto_approve = ["fs.read", "fs.list", "fs.search", "web.search", "web.fetch"]
network = true                   # false = fully offline (disables web research)
encrypt_at_rest = true           # memories + chat log encrypted; key protected by your Windows login (DPAPI)
screen_access = false            # screenshots + OCR (asks each time when on)
ui_automation = false            # keyboard/mouse control of apps (asks each time when on)
shell_allow = ["python", "py", "pytest", "git", "node", "npm", "dir", "where"]
[security.apps]
notepad = "notepad.exe"
calculator = "calc.exe"
vscode = "code"
chrome = "chrome.exe"
spotify = "spotify.exe"

[voice]                          # run: aether-voice   (all on the CPU; the GPU stays with the LLM)
stt_model = "small.en"           # base.en is faster; medium.en is better on strong accents but ~3x slower
stt_beam_size = 5
stt_prompt = ""                   # extra context for Whisper, e.g. "Robotics student. Terms: ROS 2, Nav2, SLAM."
tts_engine = "auto"              # Kokoro if installed (get_model.py kokoro), else Piper, else the Windows voice
kokoro_voice = "bm_george"       # British; blend: "bm_george:0.7,bm_lewis:0.3"; also bm_fable, bm_daniel, bf_emma
tts_voice_path = "C:/AETHER/models/voices/en/en_GB/alan/medium/en_GB-alan-medium.onnx"   # from get_model.py voice
partials = true                  # live transcript while you speak; also decides when you've finished
end_of_turn = true               # short pause after a finished request, longer when you trail off
ack_after_s = 1.2                # "One moment." if the answer hasn't started by then (0 = off)
wake_word = "hey_jarvis"
wake_by_name = true              # also wake on "hey Nova" (checked with a tiny Whisper model)
wake_verifier_path = ""          # set by scripts\learn_my_voice.py: tunes the backup wake model to your voice
vad_energy = 0.012               # raise if background noise triggers it
barge_in = true

[vision]                         # optional: understand screenshots and images (loaded only when used)
model_path = ""                  # e.g. C:/AETHER/models/vision/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf
mmproj_path = ""                 # e.g. C:/AETHER/models/vision/mmproj-Qwen2.5-VL-3B-Instruct-f16.gguf
handler = "qwen25vl"
gpu_layers = 0

[relay]
# Talk to AETHER from your phone on the home Wi-Fi (Settings shows the link once this is on).
enabled = false
port = 8766

[proactive]
enabled = true
quiet_start = "23:00"
quiet_end = "07:30"
max_per_hour = 3
morning_brief = "08:30"          # "" to turn off
wellness_checkins = true
event_alert_minutes = 15         # "lecture in 15 minutes" (0 = off)
evening_review = "20:00"         # what's still open + tomorrow's first event ("" = off)
low_battery = 20                 # warn on battery at or below this percent (0 = off)
overwork_hours = 10              # "call it a day?" after this many hours at the keyboard (0 = off)
rest_days = true                 # suggest a rest day when training, sleep or late nights say so
weekly_review = true             # Sunday evening: "your week in review"

[learning]
# Overnight learning from your corrections: lessons go into the prompt, the night pass distils them.
enabled = true
idle_minutes = 30                # run when plugged in and you've been away this long
night_hours = "1-6"              # if idle time can't be read, run in this window
use_lessons = true               # remind the model of past corrections that fit the question

[online]
# Live information with no accounts or API keys. Turn security.network off to go fully offline.
location = ""                    # e.g. "Vellore" or "Vellore, India": used for weather
news_feeds = ["https://feeds.bbci.co.uk/news/world/rss.xml", "https://www.thehindu.com/news/national/feeder/default.rss", "https://feeds.arstechnica.com/arstechnica/index"]
news_region = "IN"
briefing_headlines = 3

[briefing]
on_first_greeting = true         # the first "AETHER, good morning" of the morning gives the briefing
window_start = "04:30"
window_end = "12:00"

[mail]
# .eml files or .mbox archives already on this PC (Outlook: drag mail here; Thunderbird: its Mail folder; Gmail: Google Takeout).
paths = ["~/Documents/AETHER/mail"]
outlook = false                  # also read the Outlook desktop app's inbox (pip install pywin32)
vip = []                         # e.g. ["riya", "rao@uni.example"]: new mail from them is a notification

[calendar]
# Export .ics files (Outlook: File > Save Calendar; Google Calendar: Settings > Import & export) into this folder.
ics_paths = ["~/Documents/AETHER/calendar"]
outlook = false                  # also read the classic Outlook desktop app on this PC (pip install pywin32)
day_start = "09:00"              # for finding free time
day_end = "21:00"
